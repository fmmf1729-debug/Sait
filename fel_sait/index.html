<script>
/* ===== ЗАЩИТА САЙТА ===== */
(function(){
  var ALLOWED=['localhost','127.0.0.1','kladovka-fela.vercel.app'];
  var CANONICAL='https://kladovka-fela.vercel.app';
  var host=location.hostname;
  var ok=!CANONICAL||host==='localhost'||host==='127.0.0.1'||ALLOWED.indexOf(host)>-1;
  if(!ok){setTimeout(function(){location.replace(CANONICAL);},1200);}
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toUpperCase();
    if(e.key==='F12')e.preventDefault();
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K'))e.preventDefault();
    if(e.ctrlKey&&(k==='U'||k==='S'||k==='P'))e.preventDefault();
  });
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('selectstart',function(e){
    if(!e.target.closest('input,textarea'))e.preventDefault();
  });
  document.documentElement.setAttribute('data-author','Fel_iks');
  try{console.log('%c✚ FEL_IKS','font-size:32px;color:#16e0e0;font-weight:900',
    '\nДизайн и код — Fel_iks. Копирование без разрешения запрещено.');}catch(e){}
})();

const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const wipe=$('#wipe'),progress=$('#progress'),head=$('#head');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse=matchMedia('(pointer:coarse)').matches;

/* темы */
const tbtns=$$('.tbtn');
function setTheme(t){if(t!=='light')t='dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);tbtns.forEach(b=>b.classList.toggle('on',b.dataset.set===t));}
tbtns.forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.set)));
setTheme(localStorage.getItem('theme')==='light'?'light':'dark');

/* роутер */
const NAMES={'':'home',home:'home',portfolio:'portfolio',orders:'orders',order:'order',opensource:'opensource',ranta:'ranta',feedback:'feedback'};
const routeName=()=>NAMES[location.hash.replace(/^#\/?/,'')]||'home';
let current=null;
function activate(n){
  $$('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+n));
  $$('.menu-links a').forEach(a=>{const h=a.getAttribute('href').replace(/^#\/?/,'');a.classList.toggle('active',(h||'home')===n);});
  current=n;window.__current=n;window.scrollTo(0,0);update();
}
function go(n){
  document.body.classList.remove('menu-open');
  if(n===current){wipe.classList.add('off');return;}
  wipe.classList.remove('off');
  setTimeout(()=>{activate(n);wipe.classList.add('off');},550);
}
addEventListener('hashchange',()=>go(routeName()));
$$('.menu a').forEach(a=>a.addEventListener('click',()=>document.body.classList.remove('menu-open')));
$$('a[href="#"]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));

/* ник-кнопка */
$$('[data-splat]').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  if(a._busy)return;a._busy=true;
  const sz=Math.max(innerWidth,innerHeight)*2.4;
  const s=document.createElement('div');s.className='splat';
  s.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:${sz}px;height:${sz}px`;
  document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('go')));
  setTimeout(()=>{location.hash=a.getAttribute('href');},380);
  setTimeout(()=>{s.remove();a._busy=false;},1100);
}));

$('#burger').addEventListener('click',()=>document.body.classList.toggle('menu-open'));

/* scramble */
const CH='█▓▒░#/\\+✚';
function scramble(el){
  const orig=el.dataset.orig||(el.dataset.orig=el.textContent);
  let f=0,total=Math.max(14,orig.length*2);
  clearInterval(el._si);
  el._si=setInterval(()=>{f++;
    el.textContent=orig.split('').map((c,i)=>c===' '||c==='_'?c:(i<(f/total)*orig.length?c:CH[Math.random()*CH.length|0])).join('');
    if(f>=total){el.textContent=orig;clearInterval(el._si);}
  },30);
}
$$('[data-scramble]').forEach((el,i)=>setTimeout(()=>scramble(el),200+i*150));
const logo=$('.logo');logo.addEventListener('mouseenter',()=>scramble(logo));

/* заголовок-разлёт */
const title=$('#splitTitle');
{
  const t=title.textContent.trim();title.setAttribute('aria-label',t);
  title.innerHTML=[...t].map(c=>`<span data-dx="${(Math.random()*2-1).toFixed(2)}" data-dy="${(Math.random()*2-1).toFixed(2)}" data-dr="${(Math.random()*2-1).toFixed(2)}">${c}</span>`).join('');
}
const splitSpans=$$('#splitTitle span');

/* кресты */
const bg=$('#bg');
const CROSS_N=coarse?14:26;
for(let i=0;i<CROSS_N;i++){
  const w=document.createElement('i'),s=document.createElement('b');
  const size=20+Math.random()*100,r=Math.random();
  w.className='crossw '+(r<.45?'w':r<.75?'k':'c');
  s.className='cross';
  w.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px`;
  s.style.cssText=`--r:${Math.random()*360|0}deg;animation-delay:-${Math.random()*12}s`;
  w.appendChild(s);bg.appendChild(w);
}

/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  const el=e.target;
  if(e.isIntersecting){
    el.classList.add('in');
    clearTimeout(el._dt);
    el._dt=setTimeout(()=>el.classList.add('done'),1200);
  }else{
    el.classList.remove('in','done');
    el.style.transform='';
  }
}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});
$$('[data-reveal]').forEach(el=>io.observe(el));

/* ===== СТОПКА РАБОТ ===== */
const WORKS=$$('#workData .work').map(f=>({
  src:f.querySelector('img').src,
  cap:f.querySelector('figcaption').textContent.trim()
}));
const area=$('#stArea');
const POS=[
  {x:0,y:0,rot:0,s:1,tint:0,z:60},
  {x:15,y:5,rot:7,s:.95,tint:.44,z:50},
  {x:-18,y:8,rot:-6,s:.92,tint:.62,z:40},
  {x:5,y:15,rot:4,s:.9,tint:.8,z:30}
];
let stIndex=0,frontJit=-3,hoverPause=false,autoT=null;
const depthOf=i=>((i-stIndex)%WORKS.length+WORKS.length)%WORKS.length;
const slots=WORKS.map((w,i)=>{
  const s=document.createElement('div');s.className='stack-slot';
  s.innerHTML=`<div class="cardface"><img src="${w.src}" alt=""><div class="tint"></div><div class="cap"><span class="dot"></span>${w.cap}<span class="eye">⤢</span></div></div>`;
  s.addEventListener('click',()=>{if(depthOf(i)===0)lbOpen(i);});
  area.appendChild(s);return s;
});
function stackLayout(){
  const spread=(coarse||hoverPause)?1.4:1;
  slots.forEach((s,i)=>{
    const d=depthOf(i);
    if(d<4){
      const p=POS[d];
      s.style.opacity=d===0?'1':String(1-p.tint*.7);
      s.style.zIndex=p.z;
      s.style.transform=`translate(-50%,-50%) translate(${(p.x*spread).toFixed(1)}%,${p.y}%) rotate(${(d===0?frontJit:p.rot).toFixed(1)}deg) scale(${p.s})`;
      s.querySelector('.tint').style.opacity=p.tint;
      s.style.pointerEvents='auto';
    }else{
      s.style.opacity='0';s.style.zIndex='0';
      s.style.transform='translate(-50%,-50%) scale(.8)';
      s.style.pointerEvents='none';
    }
  });
  $('#stCount').textContent=String(stIndex+1).padStart(2,'0')+' / '+String(WORKS.length).padStart(2,'0');
  $('#stNick').innerHTML=`<b>✚</b> ${WORKS[stIndex].cap}`;
}
function stFlip(dir,ms){
  stIndex=(stIndex+dir+WORKS.length)%WORKS.length;
  frontJit=-3+(Math.random()*8-4);
  area.style.setProperty('--stack-ms',(ms||450)+'ms');
  stackLayout();autoReset();
}
$('#stNext').addEventListener('click',()=>stFlip(1,450));
$('#stPrev').addEventListener('click',()=>stFlip(-1,450));
let wheelLock=0;
area.addEventListener('wheel',e=>{
  e.preventDefault();
  const now=performance.now();
  if(now-wheelLock<90)return;
  wheelLock=now;
  stFlip(e.deltaY>0?1:-1,900);
},{passive:false});
let tX=0,tAcc=0,tLast=0,tVel=0,swiping=false,flipQ=0;
area.addEventListener('touchstart',e=>{swiping=true;tX=e.touches[0].clientX;tAcc=0;tVel=0;tLast=performance.now();flipQ=0;},{passive:true});
area.addEventListener('touchmove',e=>{
  if(!swiping)return;
  const x=e.touches[0].clientX,now=performance.now();
  const dx=x-tX,dt=now-tLast;if(dt>0)tVel=dx/dt;
  tLast=now;tAcc+=dx;
  while(Math.abs(tAcc)>=45){stFlip(tAcc<0?1:-1,450);tAcc-=Math.sign(tAcc)*45;flipQ++;}
},{passive:true});
area.addEventListener('touchend',()=>{
  if(!swiping)return;swiping=false;
  const extra=Math.max(0,Math.min(Math.round(Math.abs(tVel)*6),8-flipQ));
  const dir=tVel<0?1:-1;let i=0;
  const step=()=>{if(i<extra){stFlip(dir,450);i++;setTimeout(step,70+i*18);}};
  if(extra>0)step();
});
if(!coarse&&!reduced){
  area.addEventListener('mousemove',e=>{
    const r=area.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    slots[stIndex].querySelector('.cardface').style.transform=`rotateX(${(-y*8).toFixed(2)}deg) rotateY(${(x*10).toFixed(2)}deg)`;
  });
  area.addEventListener('mouseenter',()=>hoverPause=true);
  area.addEventListener('mouseleave',()=>{
    hoverPause=false;
    slots.forEach(s=>s.querySelector('.cardface').style.transform='');
  });
}
function autoReset(){
  clearTimeout(autoT);
  if(!reduced)autoT=setTimeout(()=>{if(!hoverPause&&!document.hidden)stFlip(1,450);},8000+Math.random()*8000);
}
stackLayout();autoReset();

/* лайтбокс */
const lb=$('#lb'),lbImg=$('#lbImg'),lbCap=$('#lbCap');
let lbI=0;
function lbOpen(i){
  lbI=(i+WORKS.length)%WORKS.length;
  const w=WORKS[lbI];
  lbImg.src=w.src;lbImg.alt=w.cap;
  lbCap.textContent=w.cap;
  lb.classList.add('open');document.body.style.overflow='hidden';
}
function lbClose(){lb.classList.remove('open');document.body.style.overflow='';}
$('.lb-x').addEventListener('click',lbClose);
$('.lb-p').addEventListener('click',e=>{e.stopPropagation();lbOpen(lbI-1);});
$('.lb-n').addEventListener('click',e=>{e.stopPropagation();lbOpen(lbI+1);});
lb.addEventListener('click',e=>{if(e.target===lb)lbClose();});
addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lbClose();
  if(e.key==='ArrowLeft')lbOpen(lbI-1);
  if(e.key==='ArrowRight')lbOpen(lbI+1);
});

/* скролл */
const sceneWrap=$('#sceneWrap'),fog=$('#fog');
let tlCache=[];
function cacheDom(){
  tlCache=$$('.tl').map(tl=>({el:tl,line:tl.querySelector('.tl-line i'),items:$$('.tl-item',tl)}));
}
cacheDom();
let tick=false,lastY=0;
function update(){
  tick=false;const y=scrollY,vw=innerWidth,vh=innerHeight;
  const docH=document.documentElement.scrollHeight-vh;
  progress.style.transform=`scaleX(${docH?y/docH:0})`;
  let q=0;
  if(current==='home'&&sceneWrap){
    const r=sceneWrap.getBoundingClientRect();
    q=clamp(-r.top/(r.height-vh),0,1);
  }
  window.__sceneQ=q;
  if(fog)fog.style.opacity=clamp(q*1.25,0,1).toFixed(2);
  for(let i=0;i<splitSpans.length;i++){
    const sp=splitSpans[i];
    sp.style.transform=`translate(${sp.dataset.dx*q*160}px,${sp.dataset.dy*q*160}px) rotate(${sp.dataset.dr*q*60}deg)`;
    sp.style.opacity=1-q*.9;
  }
  lastY=y;
  for(let i=0;i<tlCache.length;i++){
    const c=tlCache[i],r=c.el.getBoundingClientRect();
    const p=clamp((vh*.85-r.top)/r.height,0,1);
    c.line.style.transform=`scaleY(${p})`;
    for(let j=0;j<c.items.length;j++){
      c.items[j].classList.toggle('on',p>=(j+.4)/c.items.length);
    }
  }
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(update);}});

/* голова */
const HEAD_BASE=600;
let hx=null,hy=null,hs=null,ho=0,vel=0,lastLoopY=scrollY;
function headTarget(){
  const y=scrollY,vw=innerWidth,vh=innerHeight;
  if(current==='home'){
    const q=window.__sceneQ||0;
    const e2=clamp((q-0.35)/0.65,0,1),e=e2*e2*(3-2*e2);
    const big=Math.min(vh*.62,vw*.55,620),small=clamp(vw*.15,86,128);
    return {x:lerp(vw-big-vw*.06,vw-small-18,e),y:lerp(vh*.14,vh-small-20,e),size:lerp(big,small,e),op:clamp((q-0.3)*4,0,1)};
  }
  const small=clamp(vw*.15,86,128);
  return {x:vw-small-18,y:vh-small-20,size:small,op:1};
}
(function loop(now){
  if(head){
    const t=headTarget();
    if(hx===null){hx=t.x;hy=t.y;hs=t.size;ho=t.op;}
    const k=reduced?1:0.09;
    hx=lerp(hx,t.x,k);hy=lerp(hy,t.y,k);hs=lerp(hs,t.size,k);ho=lerp(ho,t.op,.12);
    const raw=scrollY-lastLoopY;lastLoopY=scrollY;
    vel=lerp(vel,clamp(raw*.2,-9,9),.08);
    const sm=hs<200?1:.25;
    const bob=reduced?0:Math.sin(now*.0016)*7*sm;
    const rot=reduced?0:Math.sin(now*.0011)*3*sm+vel*.6;
    head.style.opacity=ho.toFixed(2);
    head.style.transform=`translate(${clamp(hx,6,innerWidth-hs-6)}px,${clamp(hy+bob,70,innerHeight-hs-8)}px) rotate(${rot}deg) scale(${hs/HEAD_BASE})`;
  }
  requestAnimationFrame(loop);
})(performance.now());

/* прожектор на карточках */
$$('.card').forEach(el=>{
  el.addEventListener('mousemove',e=>{
    const r=el.getBoundingClientRect();
    el.style.setProperty('--mx',(e.clientX-r.left)+'px');
    el.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
});
/* тильт */
$$('[data-tilt]').forEach(el=>{
  el.addEventListener('mousemove',e=>{
    const r=el.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5,yy=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(700px) rotateX(${yy*-6}deg) rotateY(${x*6}deg)`;
  });
  el.addEventListener('mouseleave',()=>el.style.transform='');
});
/* магнит */
$$('.magnet').forEach(el=>{
  el.addEventListener('mousemove',e=>{
    const r=el.getBoundingClientRect();
    const dx=clamp((e.clientX-r.left-r.width/2)*.12,-6,6);
    const dy=clamp((e.clientY-r.top-r.height/2)*.16,-6,6);
    el.style.transform=`translate(${dx}px,${dy}px)`;
  });
  el.addEventListener('mouseleave',()=>el.style.transform='');
});
/* ripple */
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=document.createElement('span');
  s.className='rip';const sz=Math.max(r.width,r.height);
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),600);
});

/* ===== ЛОАДЕР ===== */
activate(routeName());
update();
let ldFinished=false;
function ldFinish(){
  if(ldFinished)return;
  ldFinished=true;
  const l=$('#loader');
  if(l){l.classList.add('done');setTimeout(()=>l.remove(),900);}
  requestAnimationFrame(()=>wipe.classList.add('off'));
}
addEventListener('load',()=>ldFinish());
setTimeout(ldFinish,4000); /* страховка */
(function(){
  const el=$('#ldCount'),bar=$('#ldBar');
  if(!el){ldFinish();return;}
  const t0=performance.now(),dur=1600;
  (function f(now){
    if(ldFinished)return;
    const p=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-p,3);
    el.textContent=String(Math.round(e*100)).padStart(3,'0');
    if(bar)bar.style.transform=`scaleX(${e})`;
    if(p<1)requestAnimationFrame(f);
    else ldFinish();
  })(t0);
})();
</script>
</body>
</html>
