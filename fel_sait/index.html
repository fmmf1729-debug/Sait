<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEL_IKS — загрузка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0d0f;
            font-family: 'JetBrains Mono', monospace;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: fixed;
            top: 0;
            left: 0;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 2rem;
            font-weight: 900;
            color: #16e0e0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(22, 224, 224, 0.6);
            animation: pulse 3s ease-in-out infinite;
        }
        .manifesto {
            position: absolute;
            top: 40px;
            right: 40px;
            max-width: 300px;
            font-size: 0.75rem;
            color: rgba(242, 246, 246, 0.7);
            line-height: 1.6;
            text-align: right;
        }
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(22, 224, 224, 0.6);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        .loading {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 0.7rem;
            color: rgba(22, 224, 224, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="overlay">
        <div class="logo">FEL_IKS</div>
        <div class="manifesto">
            Наш мир — это пересечение<br>
            креатива, технологий и<br>
            сообщества. Мы строим<br>
            цифровое будущее.
        </div>
        <div class="scroll-hint">Скролль чтобы продолжить</div>
        <div class="loading">загрузка системы...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== ИНИЦИАЛИЗАЦИЯ =====
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0d0f, 0.02);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8);
        camera.lookAt(0, 2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // ===== ОСВЕЩЕНИЕ =====
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        const pointLight1 = new THREE.PointLight(0x16e0e0, 1.5, 50);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x16e0e0, 1, 50);
        pointLight2.position.set(-5, 3, -5);
        scene.add(pointLight2);

        // ===== МАТЕРИАЛЫ =====
        const blockMaterial = new THREE.MeshPhongMaterial({
            color: 0x0f1517,
            emissive: 0x16e0e0,
            emissiveIntensity: 0.2,
            shininess: 100,
            transparent: true,
            opacity: 0.9
        });
        
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0x16e0e0,
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide
        });

        // ===== СОЗДАНИЕ ИГЛУ =====
        const iglooGroup = new THREE.Group();
        const blocks = [];
        const connections = [];
        
        // Генерация блоков иглу
        function createIglooBlock(x, y, z, index) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const block = new THREE.Mesh(geometry, blockMaterial);
            block.position.set(x, y, z);
            block.userData = { 
                originalPos: { x, y, z },
                index: index,
                angle: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 0.5
            };
            
            // Свечение внутри блока
            const glowGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const glow = new THREE.Mesh(glowGeo, glowMaterial);
            block.add(glow);
            
            // Номер на блоке
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#16e0e0';
            ctx.font = 'bold 40px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(index, 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.6, 0.6, 1);
            block.add(sprite);
            
            blocks.push(block);
            iglooGroup.add(block);
            return block;
        }

        // Создаем слои иглу
        let blockIndex = 1;
        
        // Нижний слой (круг)
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const x = Math.cos(angle) * 2;
            const z = Math.sin(angle) * 2;
            createIglooBlock(x, 0.5, z, blockIndex++);
        }
        
        // Второй слой
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;
            const x = Math.cos(angle) * 1.8;
            const z = Math.sin(angle) * 1.8;
            createIglooBlock(x, 1.5, z, blockIndex++);
        }
        
        // Третий слой
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const x = Math.cos(angle) * 1.5;
            const z = Math.sin(angle) * 1.5;
            createIglooBlock(x, 2.5, z, blockIndex++);
        }
        
        // Верхние блоки
        for (let i = 0; i < 3; i++) {
            const angle = (i / 3) * Math.PI * 2 + Math.PI / 3;
            const x = Math.cos(angle) * 1;
            const z = Math.sin(angle) * 1;
            createIglooBlock(x, 3.5, z, blockIndex++);
        }
        
        // Вход
        createIglooBlock(0, 0.5, 2.5, blockIndex++);
        createIglooBlock(0, 1.5, 2.5, blockIndex++);

        // ===== ЛИНии-СОЕДИНЕНИЯ (ТЕХНО-ВОЛНЫ) =====
        const lineMaterial = new THREE.LineBasicMaterial({ 
            color: 0x16e0e0, 
            transparent: true, 
            opacity: 0.3 
        });
        
        function createConnection(block1, block2) {
            const points = [];
            points.push(block1.position.clone());
            points.push(block2.position.clone());
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, lineMaterial);
            line.userData = { block1, block2 };
            connections.push(line);
            scene.add(line);
        }
        
        // Создаем соединения между близкими блоками
        for (let i = 0; i < blocks.length; i++) {
            for (let j = i + 1; j < blocks.length; j++) {
                const dist = blocks[i].position.distanceTo(blocks[j].position);
                if (dist < 2.5) {
                    createConnection(blocks[i], blocks[j]);
                }
            }
        }

        // ===== ЛАНДШАФТ (СНЕГ) =====
        const terrainGeometry = new THREE.PlaneGeometry(50, 50, 100, 100);
        const terrainMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x0f1517,
            flatShading: true,
            shininess: 0
        });
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.rotation.x = -Math.PI / 2;
        
        // Добавляем шум к ландшафту
        const positions = terrain.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const y = positions.getY(i);
            const z = Math.sin(x * 0.3) * Math.cos(y * 0.3) * 0.5 + 
                      Math.sin(x * 0.1 + y * 0.2) * 0.3;
            positions.setZ(i, z);
        }
        terrain.geometry.attributes.position.needsUpdate = true;
        terrain.geometry.computeVertexNormals();
        scene.add(terrain);

        // ===== ЧАСТИЦЫ (СНЕГ) =====
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 30;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x16e0e0,
            transparent: true,
            opacity: 0.6
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // ===== АНИМАЦИЯ =====
        let time = 0;
        let isAssembling = true;
        const assembleSpeed = 0.02;
        
        // Начальная позиция блоков (разбросаны)
        blocks.forEach(block => {
            block.userData.scatteredPos = {
                x: block.position.x + (Math.random() - 0.5) * 10,
                y: block.position.y + Math.random() * 5,
                z: block.position.z + (Math.random() - 0.5) * 10
            };
            block.position.set(
                block.userData.scatteredPos.x,
                block.userData.scatteredPos.y,
                block.userData.scatteredPos.z
            );
        });

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            
            // Анимация сборки/разборки
            blocks.forEach((block, i) => {
                const targetPos = isAssembling ? 
                    block.userData.originalPos : 
                    block.userData.scatteredPos;
                
                block.position.x += (targetPos.x - block.position.x) * assembleSpeed;
                block.position.y += (targetPos.y - block.position.y) * assembleSpeed;
                block.position.z += (targetPos.z - block.position.z) * assembleSpeed;
                
                // Вращение блоков
                block.rotation.x += 0.01 * block.userData.speed;
                block.rotation.y += 0.01 * block.userData.speed;
                
                // Пульсация свечения
                const glow = block.children[0];
                const scale = 1 + Math.sin(time * 2 + i) * 0.1;
                glow.scale.set(scale, scale, scale);
            });
            
            // Обновление линий
            connections.forEach(line => {
                const positions = line.geometry.attributes.position;
                positions.setXYZ(0, line.userData.block1.position.x, line.userData.block1.position.y, line.userData.block1.position.z);
                positions.setXYZ(1, line.userData.block2.position.x, line.userData.block2.position.y, line.userData.block2.position.z);
                positions.needsUpdate = true;
                
                // Пульсация линий
                line.material.opacity = 0.2 + Math.sin(time * 3 + line.userData.block1.userData.index) * 0.15;
            });
            
            // Анимация камеры
            camera.position.x = Math.sin(time * 0.3) * 8;
            camera.position.z = Math.cos(time * 0.3) * 8;
            camera.position.y = 6 + Math.sin(time * 0.5) * 1;
            camera.lookAt(0, 2, 0);
            
            // Анимация частиц
            particlesMesh.rotation.y = time * 0.05;
            particlesMesh.position.y = Math.sin(time * 0.2) * 2;
            
            // Переключение режимов
            if (isAssembling && time > 8) {
                setTimeout(() => { isAssembling = false; }, 2000);
            } else if (!isAssembling && time > 16) {
                time = 0;
                isAssembling = true;
            }
            
            renderer.render(scene, camera);
        }

        // ===== РЕСАЙЗ =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== СКРОЛЛ ДЛЯ ПЕРЕХОДА =====
        let scrollTimeout;
        window.addEventListener('wheel', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                // Здесь будет переход на основной сайт
                window.location.hash = '#/home';
            }, 1000);
        }, { passive: true });

        animate();
    </script>
</body>
</html>
